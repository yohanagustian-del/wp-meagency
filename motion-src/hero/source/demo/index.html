<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MEA Agency hero: scroll-scrub test</title>
<link rel="preload" as="image" type="image/webp" href="../posters/poster-first-1200.webp" media="(min-width: 768px)">
<link rel="preload" as="image" type="image/webp" href="../posters/poster-first-720.webp" media="(max-width: 767.98px)">
<style>
  @font-face { font-family: "Inter"; src: url("inter-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Inter"; src: url("inter-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  :root { --bg: #1A1A1A; --fg: #FAFAFA; --muted: #A3A3A8; --o1: #EC7832; --o2: #F69541; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 17px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .track { position: relative; }
  .hero { min-height: 100vh; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: clamp(24px, 4vw, 64px); width: min(1280px, 100%); margin: 0 auto; padding: clamp(24px, 5vw, 72px); }
  h1 { font-weight: 600; font-size: clamp(38px, 5vw, 64px); line-height: 1.05; letter-spacing: -0.022em; margin: 0 0 20px; max-width: 11ch; text-wrap: balance; }
  .lede { color: var(--muted); margin: 0 0 32px; max-width: 40ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 10px; font: 600 16px/1 Inter, system-ui, sans-serif; text-decoration: none; }
  .btn-primary { color: #1A1A1A; background: linear-gradient(135deg, var(--o1), var(--o2)); }
  .btn-ghost { color: var(--fg); box-shadow: inset 0 0 0 1.5px #3A3A3D; }
  .btn:focus-visible, .hud button:focus-visible { outline: 2px solid var(--o2); outline-offset: 3px; }
  .stage { position: relative; width: 100%; aspect-ratio: 1 / 1; }
  .stage img, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage canvas { opacity: 0; }
  .stage.live canvas { opacity: 1; }
  .stage.live img { visibility: hidden; }
  .after { width: min(1280px, 100%); margin: 0 auto; padding: 96px clamp(24px, 5vw, 72px); min-height: 120vh; min-height: 120svh; color: var(--muted); }
  body.pin .track { height: 260vh; height: 260svh; }
  body.pin .hero { position: sticky; top: 0; height: 100vh; height: 100svh; }
  body.pin .stage { max-width: min(100%, 64vh); max-width: min(100%, 64svh); justify-self: center; }
  @media (max-width: 767.98px) {
    .hero { grid-template-columns: 1fr; align-content: start; padding-top: 40px; gap: 28px; }
    .stage { max-width: 560px; justify-self: center; }
  }
  .hud { position: fixed; z-index: 10; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 12px; background: rgba(35, 35, 37, 0.92); border: 1px solid #333336; font: 600 13px/1 Inter, system-ui, sans-serif; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .hud button { font: inherit; color: var(--muted); background: none; border: 0; border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .hud button[aria-pressed="true"] { color: var(--fg); background: #2E2E31; }
  .hud button:disabled { opacity: 0.4; cursor: default; }
  .hud output { color: var(--muted); padding: 0 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<div class="track" id="track">
  <section class="hero" id="hero">
    <div class="copy">
      <h1>Toko online Anda, kami yang jalankan</h1>
      <p class="lede">Iklan, toko, konten, live, dan affiliate di Shopee dan TikTok Shop, dijalankan satu tim.</p>
      <div class="actions">
        <a class="btn btn-primary" href="#">Jadwalkan konsultasi</a>
        <a class="btn btn-ghost" href="#">Lihat layanan</a>
      </div>
    </div>
    <div class="stage" id="stage" aria-hidden="true">
      <picture>
        <source media="(max-width: 767.98px)" srcset="../posters/poster-first-720.webp">
        <img id="poster" src="../posters/poster-first-1200.webp" width="1200" height="1200" alt="" fetchpriority="high">
      </picture>
      <canvas id="seq"></canvas>
    </div>
  </section>
</div>
<section class="after"><p>Scroll back up to scrub the sequence again.</p></section>
<div class="hud" role="group" aria-label="Scroll test">
  <button type="button" data-mode="scroll" aria-pressed="true">Scroll away</button>
  <button type="button" data-mode="pin" aria-pressed="false">Pinned</button>
  <output id="readout">0/119</output>
</div>
<script>
(() => {
  'use strict';
  const SEQ = {
    desktop: { dir: '../frames/desktop/', count: __DESKTOP_COUNT__, size: 1200, last: '../posters/poster-last-1200.webp' },
    mobile:  { dir: '../frames/mobile/',  count: __MOBILE_COUNT__,  size: 720,  last: '../posters/poster-last-720.webp' },
  };
  const $ = id => document.getElementById(id);
  const stage = $('stage'), canvas = $('seq'), poster = $('poster'), track = $('track'), readout = $('readout');
  const ctx = canvas.getContext('2d');
  const mobile = matchMedia('(max-width: 767.98px)').matches;
  const seq = mobile ? SEQ.mobile : SEQ.desktop;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frames = new Array(seq.count), loaded = new Uint8Array(seq.count);
  const btns = [...document.querySelectorAll('[data-mode]')];
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  let current = 0, target = 0, drawn = -1, raf = 0, inView = true, nLoaded = 0;

  // Brief: frame 0 at page top, last frame when the hero has scrolled away.
  // Pinned: the hero is held (sticky) for a 260svh track while the sequence plays.
  function progress() {
    const top = track.getBoundingClientRect().top + scrollY;
    if (document.body.classList.contains('pin')) {
      const span = track.offsetHeight - innerHeight;
      return span > 0 ? clamp((scrollY - top) / span, 0, 1) : 0;
    }
    return clamp(scrollY / (top + track.offsetHeight), 0, 1);
  }
  function sizeCanvas() {
    const px = Math.max(1, Math.round(Math.min(stage.clientWidth * Math.min(devicePixelRatio || 1, 2), seq.size)));
    if (canvas.width !== px) { canvas.width = canvas.height = px; drawn = -1; }
  }
  function nearest(i) {
    if (loaded[i]) return i;
    for (let d = 1; d < seq.count; d++) {
      if (i - d >= 0 && loaded[i - d]) return i - d;
      if (i + d < seq.count && loaded[i + d]) return i + d;
    }
    return -1;
  }
  function paint() {
    const k = nearest(Math.round(current));
    if (k < 0 || k === drawn) return;
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(frames[k], 0, 0, canvas.width, canvas.height);
    drawn = k;
    stage.classList.add('live');
  }
  function tick() {
    raf = 0;
    target = progress() * (seq.count - 1);
    current += (target - current) * 0.25;
    if (Math.abs(target - current) < 0.02) current = target;
    paint();
    readout.value = `${Math.round(current / (seq.count - 1) * 119)}/119 · ${nLoaded}/${seq.count}`;
    if (current !== target && inView) raf = requestAnimationFrame(tick);
  }
  const kick = () => { if (!raf && inView) raf = requestAnimationFrame(tick); };

  // Progressive load: first, last, then every 16th, 8th, 4th, 2nd frame, then the rest.
  function order(n) {
    const out = [0, n - 1], seen = new Set(out);
    for (let s = 16; s >= 1; s >>= 1) for (let i = 0; i < n; i += s) if (!seen.has(i)) { seen.add(i); out.push(i); }
    return out;
  }
  function load() {
    const q = order(seq.count); let next = 0, busy = 0;
    const pump = () => {
      while (busy < 6 && next < q.length) {
        const i = q[next++], im = new Image(); busy++;
        im.decoding = 'async';
        im.onload = () => (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).then(() => {
          frames[i] = im; loaded[i] = 1; nLoaded++; busy--; paint(); kick(); pump();
        });
        im.onerror = () => { busy--; pump(); };
        im.src = seq.dir + String(i).padStart(3, '0') + '.webp';
      }
    };
    pump();
  }
  function setMode(m) {
    document.body.classList.toggle('pin', m === 'pin');
    btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    try { const u = new URL(location.href); u.searchParams.set('mode', m); history.replaceState(null, '', u); } catch (e) {}
    kick();
  }
  btns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  setMode(new URLSearchParams(location.search).get('mode') === 'pin' ? 'pin' : 'scroll');

  if (reduce) {   // reduced motion: show the resolved final frame, no sequence
    const s = stage.querySelector('source'); if (s) s.srcset = SEQ.mobile.last;
    poster.src = SEQ.desktop.last;
    readout.value = 'reduced motion';
    btns.forEach(b => { b.disabled = true; });
    return;
  }
  new IntersectionObserver(es => { inView = es[0].isIntersecting; if (inView) kick(); }, { rootMargin: '120px' }).observe(stage);
  addEventListener('scroll', kick, { passive: true });
  addEventListener('resize', () => { sizeCanvas(); paint(); kick(); });
  if ('ResizeObserver' in window) new ResizeObserver(() => { sizeCanvas(); paint(); }).observe(stage);
  sizeCanvas();
  const start = () => setTimeout(load, 0);
  if (document.readyState === 'complete') start(); else addEventListener('load', start, { once: true });
  kick();
})();
</script>
</body>
</html>
