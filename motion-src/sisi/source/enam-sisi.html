<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
<defs>
<linearGradient id="og" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="480" y2="480"><stop offset="0" stop-color="#EC7832"/><stop offset="1" stop-color="#F69541"/></linearGradient>
<clipPath id="inner"><rect x="3" y="3" width="474" height="474"/></clipPath>
</defs>
<rect width="480" height="480" fill="#232325"/>
<g id="scenes" clip-path="url(#inner)"></g>
<rect x="1.5" y="1.5" width="477" height="477" fill="none" stroke="url(#og)" stroke-width="3"/>
</svg>
<div id="ui"><select id="sel"></select><input id="time" type="range" min="0" max="3" step="0.0166667" value="0"><output id="out">0.000 s</output></div>
<script>
'use strict';
/* ====================== STYLE LOCK · 480 x 480, shown at 120–160 px ====================== */
const LOCK = {
  face: '#232325', line: '#FAFAFA',
  edgeA: '#EC7832', edgeB: '#F69541',   // one tile-wide field, 135° (top-left -> bottom-right), as in M1
  edge: 3,      // hero: 2 px on a 292 px tile = 3.3 px on 480; 3 px is also the 120 px floor
  stroke: 3,    // pictogram lines #FAFAFA; orange only on the moving element
  orangeStroke: 4,  // orange lines: 3 px read brown at 120 px (75% coverage on #232325); 4 px = one full pixel
  loop: 3, holdIn: 0.1, holdOut: 2.7,   // 400 ms hold across the loop point: 0.1 s + 0.3 s
};
/* =========================================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const defs = document.querySelector('#stage defs'), root = document.getElementById('scenes');
const clamp01 = t => Math.min(1, Math.max(0, t));
const lerp = (a, b, t) => a + (b - a) * t;
const R3 = v => Math.round(v * 1000) / 1000;
/* M1 motion lock: exponential ease-out with a tiny C1 start ramp (copied from cube.html) */
const expoOut = (t, k) => (1 - Math.pow(2, -k * t)) / (1 - Math.pow(2, -k));
function ease(t, k = 5, tau = 0.06) {
  t = clamp01(t);
  const u = t < tau ? (t * t) / (2 * tau) : t - tau / 2;
  return expoOut(clamp01(u / (1 - tau / 2)), k);
}
const seg = (t, a, b, k = 5) => ease((t - a) / (b - a), k);
const smooth = w => w * w * (3 - 2 * w);
function set(e, a) { for (const k in a) e.setAttribute(k, typeof a[k] === 'number' ? R3(a[k]) : a[k]); return e; }
function el(tag, a, parent) { const e = document.createElementNS(NS, tag); set(e, a || {}); parent.appendChild(e); return e; }
const show = (e, on) => e.setAttribute('display', on ? 'inline' : 'none');
const about = (cx, cy, s) => `translate(${R3(cx)} ${R3(cy)}) scale(${R3(s)}) translate(${R3(-cx)} ${R3(-cy)})`;
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, w) => { const A = rgb(a), B = rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * w)).join(',') + ')'; };
const OR = 'url(#og)';
const LINE = { fill: 'none', stroke: LOCK.line, 'stroke-width': LOCK.stroke };
const SOLID = { fill: OR, stroke: OR, 'stroke-width': LOCK.stroke };   // orange shape, same outer size as a 3 px outline

const SCENES = [];
function scene(name, build) {
  const g = el('g', { id: 'sc-' + name }, root);   // visible while building, so text can be measured
  SCENES.push({ name, g, render: build(g) });
}

function buildAll() {
/* -------------------------------------------------------------------------------------------
   1 · IKLAN — three budget bars; the orange one grows while the others shrink, then rebalance.
   Total length is conserved (456 px): budget moves, it is not added.                         */
scene('iklan', g => {
  const AX = 136, H = 36, Y = [160, 222, 284];
  const REST = [176, 128, 152], PEAK = [136, 208, 112];
  const bars = Y.map((y, i) => el('rect', Object.assign({ x: AX, y, width: REST[i], height: H }, i === 1 ? SOLID : LINE), g));
  el('line', Object.assign({ x1: AX, y1: 140, x2: AX, y2: 340 }, LINE), g);   // axis on top of the bar ends
  return t => {
    const up = seg(t, 0.10, 1.05, 5), back = seg(t, 1.45, LOCK.holdOut, 5);
    bars.forEach((b, i) => set(b, { width: lerp(lerp(REST[i], PEAK[i], up), REST[i], back) }));
  };
});

/* -------------------------------------------------------------------------------------------
   2 · TIKTOK SHOP — a dot travels from the play button into the store; the store pulses once. */
scene('tiktok-shop', g => {
  const CY = 256, PX = 140, PR = 46, SX = 320, DOT = 10;
  el('circle', Object.assign({ cx: PX, cy: CY, r: PR }, LINE), g);
  el('path', Object.assign({ d: `M${PX - 12},${CY - 21} L${PX + 24},${CY} L${PX - 12},${CY + 21} Z`, 'stroke-linejoin': 'round' }, LINE), g);
  const store = el('g', {}, g);
  const NSS = { 'vector-effect': 'non-scaling-stroke' };
  // awning: straight band + three scallops (r 22), body walls, door
  el('path', Object.assign({ d: `M${SX - 66},160 H${SX + 66} V182 A22,22 0 0 1 ${SX + 22},182 A22,22 0 0 1 ${SX - 22},182 A22,22 0 0 1 ${SX - 66},182 Z`, 'stroke-linejoin': 'miter' }, LINE, NSS), store);
  el('path', Object.assign({ d: `M${SX - 58},198.97 V320 H${SX + 58} V198.97` }, LINE, NSS), store);
  el('path', Object.assign({ d: `M${SX - 20},320 V264 H${SX + 20} V320` }, LINE, NSS), store);
  const dot = el('circle', { cx: PX + PR, cy: CY, r: DOT, fill: OR }, g);
  const DOCK = { x: PX + PR, y: CY }, DOOR = { x: SX, y: 292 };
  return t => {
    const go = seg(t, 0.10, 1.10, 4), sink = seg(t, 1.00, 1.20, 4), reborn = seg(t, 2.05, 2.65, 5);
    const s = 1 + 0.06 * seg(t, 1.10, 1.35, 4) - 0.06 * seg(t, 1.35, 1.95, 4);
    set(store, { transform: about(SX, 240, s) });
    let x = DOCK.x, y = DOCK.y, r = DOT * reborn;
    if (sink < 1) { x = lerp(DOCK.x, DOOR.x, go); y = lerp(DOCK.y, DOOR.y, go); r = DOT * (1 - sink); }
    set(dot, { cx: x, cy: y, r: Math.max(r, 0) }); show(dot, r > 0.01);
  };
});

/* -------------------------------------------------------------------------------------------
   3 · SHOPEE — products drop into the bag one by one; each landing pushes the stack down one
   slot, so the last (orange) one ends where the loop began: peeking out of the bag.           */
scene('shopee', g => {
  const CX = 240, RIM = 187, BW = 172, BH = 176, S = 64, GAP = 8, P = S + GAP, PEEK = 32;
  const TOP0 = RIM - PEEK, START = -S - 6;
  el('path', Object.assign({ d: `M${CX - 46},${RIM} V${RIM - 24} A46,46 0 0 1 ${CX + 46},${RIM - 24} V${RIM}` }, LINE), g);
  const cp = el('clipPath', { id: 'shopee-above-rim' }, defs);
  el('rect', { x: 0, y: 0, width: 480, height: RIM }, cp);
  const stack = el('g', { 'clip-path': 'url(#shopee-above-rim)' }, g);
  // 0 = orange from the previous cycle, 1-2 white, 3 orange (white ones are filled with the face colour so they hide the handle)
  const items = [0, 1, 2, 3].map(i => el('rect', Object.assign({ x: CX - S / 2, y: START, width: S, height: S },
    (i === 0 || i === 3) ? SOLID : Object.assign({}, LINE, { fill: LOCK.face })), stack));
  el('rect', Object.assign({ x: CX - BW / 2, y: RIM, width: BW, height: BH }, LINE), g);
  const DROP = [0.10, 0.95, 1.80];
  return t => {
    let sunk = 0; DROP.forEach(d => { sunk += seg(t, d + 0.46, d + 0.90, 4); });
    items.forEach((it, i) => {
      const target = TOP0 - (i - sunk) * P;
      const y = i === 0 ? target : lerp(START, target, seg(t, DROP[i - 1], DROP[i - 1] + 0.52, 4));
      set(it, { y }); show(it, y + S + 1.5 > 3 && y - 1.5 < RIM);
    });
  };
});

/* -------------------------------------------------------------------------------------------
   4 · LIVE — phone, orange LIVE pill (the only text), viewer dots appear and drift up.        */
scene('live', g => {
  const PH = { x: 158, y: 66, w: 164, h: 348 };
  el('rect', Object.assign({ x: PH.x, y: PH.y, width: PH.w, height: PH.h, rx: 22 }, LINE), g);
  el('line', Object.assign({ x1: 226, y1: 88, x2: 254, y2: 88, 'stroke-linecap': 'round' }, LINE), g);
  const FS = 26, LS = 1, PAD = 15, PH_H = 42, PX0 = PH.x + 20, PY0 = PH.y + 38;
  const pill = el('g', {}, g);
  const shape = el('rect', { x: PX0, y: PY0, height: PH_H, rx: PH_H / 2, fill: OR }, pill);
  const label = el('text', { 'font-family': 'Inter M2', 'font-weight': 600, 'font-size': FS, 'letter-spacing': LS, fill: LOCK.face }, pill);
  label.textContent = 'LIVE';
  const w = label.getComputedTextLength() - LS;          // advance width without the trailing letter-space
  const PW = Math.round(w + 2 * PAD), PC = { x: PX0 + PW / 2, y: PY0 + PH_H / 2 };
  set(shape, { width: PW });
  set(label, { x: PC.x - w / 2, y: PC.y + FS * 0.7275 / 2 });  // cap-height centring (Inter capHeight 1490/2048)
  const DOTS = [
    { x: 288, r: 9, t0: 0.30, rise: 160 }, { x: 272, r: 7, t0: 0.58, rise: 148 },
    { x: 294, r: 10, t0: 0.86, rise: 172 }, { x: 278, r: 7, t0: 1.14, rise: 150 },
    { x: 290, r: 8, t0: 1.42, rise: 158 }];
  const Y0 = 372, LIFE = 1.25;
  const dots = DOTS.map(d => el('circle', { cx: d.x, cy: Y0, r: 0, fill: LOCK.line }, g));
  return t => {
    set(pill, { transform: about(PC.x, PC.y, 1 + 0.08 * seg(t, 0.10, 0.40, 4) - 0.08 * seg(t, 0.40, 0.95, 4)) });
    DOTS.forEach((d, i) => {
      const live = t > d.t0 && t < d.t0 + LIFE; show(dots[i], live);
      if (!live) return;
      set(dots[i], { cy: Y0 - d.rise * seg(t, d.t0, d.t0 + LIFE, 3), r: d.r * seg(t, d.t0, d.t0 + 0.22, 5),
                     opacity: 1 - seg(t, d.t0 + 0.55, d.t0 + LIFE, 2) });
    });
  };
});

/* -------------------------------------------------------------------------------------------
   5 · AFFILIATE — centre node + five outer nodes; orange lines connect outer to centre one at a
   time. The loop opens by drawing the finished network back into the centre.                 */
scene('affiliate', g => {
  const C = { x: 242, y: 254 }, RC = 34, RO = 18, RAD = 144;   // x 242: the vertical 4 px line lands on the 4 px grid
  const nodes = [-90, -18, 54, 126, 198].map(a => a * Math.PI / 180)
    .map(a => ({ x: C.x + RAD * Math.cos(a), y: C.y + RAD * Math.sin(a) }));
  const spans = nodes.map(p => {
    const dx = C.x - p.x, dy = C.y - p.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const a = RO + LOCK.stroke / 2 - 0.5, b = RC + LOCK.stroke / 2 - 0.5;   // tuck 0.5 px under each ring
    return { sx: p.x + ux * a, sy: p.y + uy * a, ex: C.x - ux * b, ey: C.y - uy * b };
  });
  const lines = spans.map(() => el('line', { stroke: OR, 'stroke-width': LOCK.orangeStroke }, g));
  el('circle', Object.assign({ cx: C.x, cy: C.y, r: RC }, LINE), g);
  nodes.forEach(p => el('circle', Object.assign({ cx: p.x, cy: p.y, r: RO }, LINE), g));
  const CONNECT = [0.55, 0.88, 1.21, 1.54, 1.87];   // clockwise from the top
  return t => {
    const back = seg(t, 0.10, 0.50, 4);
    lines.forEach((ln, i) => {
      const sp = spans[i];
      const [a, b] = t < CONNECT[i] ? [back, 1] : [0, seg(t, CONNECT[i], CONNECT[i] + 0.60, 4)];
      set(ln, { x1: lerp(sp.sx, sp.ex, a), y1: lerp(sp.sy, sp.ey, a), x2: lerp(sp.sx, sp.ex, b), y2: lerp(sp.sy, sp.ey, b) });
      show(ln, b - a > 0.002);
    });
  };
});

/* -------------------------------------------------------------------------------------------
   6 · KONTEN — three vertical video frames slide left in a filmstrip; the frame that arrives in
   the centre turns orange-edged. Two advances per loop; frames are identical, so the strip
   after two steps is pixel-for-pixel the strip it started as.                                */
scene('konten', g => {
  // the centre frame's 4 px orange edge sits exactly on the 4 px grid, so at 120 px it is one full-colour pixel
  const FW = 108, FH = 192, FY = 142, PITCH = 148;
  // rails at y 117.5 / 357.5: each 3 px line fills one 4 px row, so it stays one crisp pixel at 120 px
  el('line', Object.assign({ x1: 0, y1: 117.5, x2: 480, y2: 117.5 }, LINE), g);
  el('line', Object.assign({ x1: 0, y1: 357.5, x2: 480, y2: 357.5 }, LINE), g);
  const frames = [-2, -1, 0, 1, 2, 3].map(k => {
    const gr = el('linearGradient', { id: 'konten-edge' + (k + 2), gradientUnits: 'userSpaceOnUse', x1: 0, y1: 0, x2: 480, y2: 480 }, defs);
    const s0 = el('stop', { offset: 0, 'stop-color': LOCK.line }, gr), s1 = el('stop', { offset: 1, 'stop-color': LOCK.line }, gr);
    const r = el('rect', { y: FY, width: FW, height: FH, fill: 'none', stroke: `url(#konten-edge${k + 2})`, 'stroke-width': LOCK.stroke }, g);
    return { k, r, s0, s1 };
  });
  return t => {
    const u = seg(t, 0.10, 1.15, 4) + seg(t, 1.65, LOCK.holdOut, 4);   // 0 -> 2 frames
    const f = u - Math.floor(u + 1e-9);
    frames.forEach(F => {
      const cx = 240 + (F.k - Math.max(f, 0)) * PITCH;
      const w = smooth(clamp01(1 - Math.abs(cx - 240) / (0.55 * PITCH)));
      set(F.r, { x: cx - FW / 2, 'stroke-width': lerp(LOCK.stroke, LOCK.orangeStroke, w) });
      F.s0.setAttribute('stop-color', mix(LOCK.line, LOCK.edgeA, w));
      F.s1.setAttribute('stop-color', mix(LOCK.line, LOCK.edgeB, w));
      show(F.r, cx + FW / 2 + 2 > 3 && cx - FW / 2 - 2 < 477);
    });
  };
});
}

/* ------------------------------------ seek API -------------------------------------------- */
let current = -1;
function seek(sc, t) {
  const i = typeof sc === 'number' ? sc : SCENES.findIndex(s => s.name === sc);
  if (i < 0) throw new Error('unknown scene ' + sc);
  if (i !== current) { SCENES.forEach((s, j) => show(s.g, j === i)); current = i; }
  t = Math.max(0, +t); if (t > LOCK.loop) t %= LOCK.loop;    // t = 3 is rendered as-is (loop-point check)
  SCENES[i].render(t);
  return i;
}
window.seek = seek;
if (new URLSearchParams(location.search).has('render')) document.documentElement.classList.add('render');
window.READY = document.fonts.load('600 26px "Inter M2"').then(() => {
  buildAll();
  seek(0, 0);
  const sel = document.getElementById('sel'), time = document.getElementById('time'), out = document.getElementById('out');
  SCENES.forEach((s, i) => sel.add(new Option(s.name, i)));
  const upd = () => { seek(+sel.value, +time.value); out.textContent = (+time.value).toFixed(3) + ' s'; };
  sel.oninput = time.oninput = upd;
  return { scenes: SCENES.map(s => s.name), loop: LOCK.loop, font: document.fonts.check('600 26px "Inter M2"') };
});
</script>
